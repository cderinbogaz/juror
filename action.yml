name: Juror AI
description: Multi-model PR review that shows you the bill — duplicate findings collapse into one, with optional agreement filtering.
author: juror-ai
branding:
  icon: check-circle
  color: purple

inputs:
  github-token:
    description: Token used to post the review. Needs pull-requests:write. Never reaches a model process.
    required: true
    default: ${{ github.token }}
  config:
    description: Path to the Juror config file. Defaults to .juror.yml at the repo root.
    required: false
  preset:
    description: Jury preset (starter, fast, balanced, high, or ultra). Defaults to fast unless config overrides it.
    required: false
  models:
    description: Comma-separated model ids to run, overriding the config's enabled set.
    required: false
  cost-target-usd:
    description: Per-PR planning target. Overrides budget.target_cost_usd_per_pr; not every provider exposes a hard limit.
    required: false
  post:
    description: Post the review to the pull request. Set to "false" for a dry run.
    required: false
    default: 'true'
  pr-number:
    description: Pull request number. Defaults to the triggering PR.
    required: false
  claude-code-version:
    description: npm version spec for Claude Code. Pinned for reproducible cost accounting.
    required: false
    default: '@anthropic-ai/claude-code@2.1.223'
  codex-version:
    description: npm version spec for Codex CLI. Must be >= 0.146.0 for cache-write accounting.
    required: false
    default: '@openai/codex@0.146.1'
  deepseek-version:
    description: npm version spec for the DeepSeek-native CodeWhale CLI.
    required: false
    default: 'codewhale@0.9.7'
  opencode-version:
    description: npm version spec for opencode.
    required: false
    default: 'opencode-ai@1.17.20'
  kimi-code-version:
    description: npm version spec for Kimi Code CLI.
    required: false
    default: '@moonshot-ai/kimi-code@0.34.0'

outputs:
  score:
    description: Merge confidence, 1-5.
    value: ${{ steps.review.outputs.score }}
  findings:
    description: Number of published findings.
    value: ${{ steps.review.outputs.findings }}
  cost-usd:
    description: Total cost of this review, or "unknown" if any harness reported neither cost nor tokens.
    value: ${{ steps.review.outputs.cost-usd }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      env:
        JUROR_ANTHROPIC_API_KEY: ''
        JUROR_OPENAI_API_KEY: ''
        JUROR_FIREWORKS_API_KEY: ''
        JUROR_XAI_API_KEY: ''
        JUROR_OPENROUTER_API_KEY: ''
        JUROR_SCALEWAY_API_KEY: ''
        ANTHROPIC_API_KEY: ''
        OPENAI_API_KEY: ''
        FIREWORKS_API_KEY: ''
        XAI_API_KEY: ''
        OPENROUTER_API_KEY: ''
        SCW_SECRET_KEY: ''
        GITHUB_TOKEN: ''
        GH_TOKEN: ''
      with:
        node-version: '22'

    # Hosted runners are disposable, so both the action build and the globally installed
    # harnesses would otherwise be recreated for every review. Hash the actual build inputs
    # instead of github.action_ref: moving refs such as `v1` keep the same name across releases.
    - name: Compute build cache key
      id: build-cache-key
      shell: bash
      env:
        JUROR_ANTHROPIC_API_KEY: ''
        JUROR_OPENAI_API_KEY: ''
        JUROR_FIREWORKS_API_KEY: ''
        JUROR_XAI_API_KEY: ''
        JUROR_OPENROUTER_API_KEY: ''
        JUROR_SCALEWAY_API_KEY: ''
        ANTHROPIC_API_KEY: ''
        OPENAI_API_KEY: ''
        FIREWORKS_API_KEY: ''
        XAI_API_KEY: ''
        OPENROUTER_API_KEY: ''
        SCW_SECRET_KEY: ''
        GITHUB_TOKEN: ''
        GH_TOKEN: ''
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        HASH="$({
          find "$ACTION_PATH/src" "$ACTION_PATH/scripts" -type f -print0
          printf '%s\0' \
            "$ACTION_PATH/action.yml" \
            "$ACTION_PATH/package.json" \
            "$ACTION_PATH/package-lock.json" \
            "$ACTION_PATH/tsconfig.json"
        } | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
        echo "key=juror-build-${RUNNER_OS}-${RUNNER_ARCH}-${HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore Juror build
      id: build-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        JUROR_ANTHROPIC_API_KEY: ''
        JUROR_OPENAI_API_KEY: ''
        JUROR_FIREWORKS_API_KEY: ''
        JUROR_XAI_API_KEY: ''
        JUROR_OPENROUTER_API_KEY: ''
        JUROR_SCALEWAY_API_KEY: ''
        ANTHROPIC_API_KEY: ''
        OPENAI_API_KEY: ''
        FIREWORKS_API_KEY: ''
        XAI_API_KEY: ''
        OPENROUTER_API_KEY: ''
        SCW_SECRET_KEY: ''
        GITHUB_TOKEN: ''
        GH_TOKEN: ''
      with:
        path: |
          ${{ github.action_path }}/node_modules
          ${{ github.action_path }}/dist
        key: ${{ steps.build-cache-key.outputs.key }}

    - name: Build Juror
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        JUROR_ANTHROPIC_API_KEY: ''
        JUROR_OPENAI_API_KEY: ''
        JUROR_FIREWORKS_API_KEY: ''
        JUROR_XAI_API_KEY: ''
        JUROR_OPENROUTER_API_KEY: ''
        JUROR_SCALEWAY_API_KEY: ''
        ANTHROPIC_API_KEY: ''
        OPENAI_API_KEY: ''
        FIREWORKS_API_KEY: ''
        XAI_API_KEY: ''
        OPENROUTER_API_KEY: ''
        SCW_SECRET_KEY: ''
        GITHUB_TOKEN: ''
        GH_TOKEN: ''
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build
        # The cached runtime only needs yaml; TypeScript/Vitest are build-time dependencies.
        npm prune --omit=dev --package-lock=false --ignore-scripts --no-audit --no-fund

    - name: Compute harness cache key
      id: harness-cache-key
      shell: bash
      env:
        CLAUDE_CODE_SPEC: ${{ inputs.claude-code-version }}
        CODEX_SPEC: ${{ inputs.codex-version }}
        DEEPSEEK_SPEC: ${{ inputs.deepseek-version }}
        OPENCODE_SPEC: ${{ inputs.opencode-version }}
        KIMI_CODE_SPEC: ${{ inputs.kimi-code-version }}
        JUROR_OPENROUTER_API_KEY: ''
        JUROR_SCALEWAY_API_KEY: ''
        OPENROUTER_API_KEY: ''
        SCW_SECRET_KEY: ''
      run: |
        set -euo pipefail
        HAS_ANTHROPIC="${JUROR_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
        HAS_OPENAI="${JUROR_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}"
        HAS_FIREWORKS="${JUROR_FIREWORKS_API_KEY:-${FIREWORKS_API_KEY:-}}"
        SPECS=()
        [ -n "$HAS_ANTHROPIC" ] && SPECS+=("$CLAUDE_CODE_SPEC")
        [ -n "$HAS_OPENAI" ] && SPECS+=("$CODEX_SPEC")
        if [ -n "$HAS_FIREWORKS" ]; then
          SPECS+=("$DEEPSEEK_SPEC" "$OPENCODE_SPEC" "$KIMI_CODE_SPEC")
        fi
        if [ "${#SPECS[@]}" -eq 0 ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        HASH="$(printf '%s\n' "${SPECS[@]}" | sha256sum | cut -d' ' -f1)"
        echo "enabled=true" >> "$GITHUB_OUTPUT"
        echo "key=juror-harnesses-node22-${RUNNER_OS}-${RUNNER_ARCH}-${HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore harnesses
      if: steps.harness-cache-key.outputs.enabled == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        JUROR_ANTHROPIC_API_KEY: ''
        JUROR_OPENAI_API_KEY: ''
        JUROR_FIREWORKS_API_KEY: ''
        JUROR_XAI_API_KEY: ''
        JUROR_OPENROUTER_API_KEY: ''
        JUROR_SCALEWAY_API_KEY: ''
        ANTHROPIC_API_KEY: ''
        OPENAI_API_KEY: ''
        FIREWORKS_API_KEY: ''
        XAI_API_KEY: ''
        OPENROUTER_API_KEY: ''
        SCW_SECRET_KEY: ''
        GITHUB_TOKEN: ''
        GH_TOKEN: ''
      with:
        path: ${{ runner.temp }}/juror-harnesses
        key: ${{ steps.harness-cache-key.outputs.key }}

    # Only harnesses backed by an available provider are installed. Fireworks supplies
    # DeepSeek through CodeWhale, custom opencode models, and Kimi K3 through Kimi Code.
    - name: Install harnesses
      shell: bash
      env:
        CLAUDE_CODE_SPEC: ${{ inputs.claude-code-version }}
        CODEX_SPEC: ${{ inputs.codex-version }}
        DEEPSEEK_SPEC: ${{ inputs.deepseek-version }}
        OPENCODE_SPEC: ${{ inputs.opencode-version }}
        KIMI_CODE_SPEC: ${{ inputs.kimi-code-version }}
        HARNESS_ROOT: ${{ runner.temp }}/juror-harnesses
        JUROR_OPENROUTER_API_KEY: ''
        JUROR_SCALEWAY_API_KEY: ''
        OPENROUTER_API_KEY: ''
        SCW_SECRET_KEY: ''
      run: |
        set -euo pipefail
        # A prefixed key wins, the bare vendor name is the pre-1.3 fallback. Gating on the
        # resolved value keeps a harness from being installed for a provider with no key.
        HAS_ANTHROPIC="${JUROR_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
        HAS_OPENAI="${JUROR_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}"
        HAS_FIREWORKS="${JUROR_FIREWORKS_API_KEY:-${FIREWORKS_API_KEY:-}}"
        HAS_XAI="${JUROR_XAI_API_KEY:-${XAI_API_KEY:-}}"
        CLEAN_ENV=(env -u JUROR_ANTHROPIC_API_KEY -u JUROR_OPENAI_API_KEY -u JUROR_FIREWORKS_API_KEY -u JUROR_XAI_API_KEY -u JUROR_OPENROUTER_API_KEY -u JUROR_SCALEWAY_API_KEY -u ANTHROPIC_API_KEY -u OPENAI_API_KEY -u FIREWORKS_API_KEY -u XAI_API_KEY -u OPENROUTER_API_KEY -u SCW_SECRET_KEY -u GITHUB_TOKEN -u GH_TOKEN)
        mkdir -p "$HARNESS_ROOT"
        install_harness() {
          local binary="$1" spec="$2"
          # Also repair an incomplete cache rather than treating a cache hit as proof that
          # every independent npm install succeeded on the run that populated it.
          [ -x "$HARNESS_ROOT/bin/$binary" ] || "${CLEAN_ENV[@]}" npm i -g --prefix "$HARNESS_ROOT" "$spec" || true
        }
        [ -n "$HAS_ANTHROPIC" ] && install_harness claude "$CLAUDE_CODE_SPEC"
        [ -n "$HAS_OPENAI"    ] && install_harness codex "$CODEX_SPEC"
        [ -n "$HAS_FIREWORKS" ] && install_harness codewhale "$DEEPSEEK_SPEC"
        [ -n "$HAS_FIREWORKS" ] && install_harness opencode "$OPENCODE_SPEC"
        [ -n "$HAS_FIREWORKS" ] && install_harness kimi "$KIMI_CODE_SPEC"
        echo "$HARNESS_ROOT/bin" >> "$GITHUB_PATH"
        if [ -n "$HAS_XAI" ]; then
          "${CLEAN_ENV[@]}" curl -fsSL https://grok.com/install.sh | "${CLEAN_ENV[@]}" bash || true
        fi
        echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

    - name: Review
      id: review
      shell: bash
      env:
        # The model processes below never see this — the CLI only loads it for the publish step,
        # which runs after every model process has exited. See design §11.
        GITHUB_TOKEN: ${{ inputs.github-token }}
        JUROR_ACTION_PATH: ${{ github.action_path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_MODELS: ${{ inputs.models }}
        INPUT_COST_TARGET: ${{ inputs.cost-target-usd }}
        INPUT_POST: ${{ inputs.post }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_FORK: ${{ github.event.pull_request.head.repo.fork }}
        TARGET_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ "$EVENT_FORK" = "true" ]; then
          echo "Skipping fork pull request: GitHub withholds provider secrets and the token cannot publish comments."
          {
            echo "score=3"
            echo "findings=0"
            echo "cost-usd=0"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        PR="$INPUT_PR_NUMBER"
        if [ -z "$PR" ]; then PR="$EVENT_PR_NUMBER"; fi
        ARGS=(review --pr "$PR" --repo "$TARGET_REPOSITORY" --repo-dir "$GITHUB_WORKSPACE" --json "$RUNNER_TEMP/juror.json")
        if [ "$INPUT_POST" = "true" ]; then ARGS+=(--post); else ARGS+=(--dry-run --post); fi
        if [ -n "$INPUT_CONFIG" ]; then ARGS+=(--config "$INPUT_CONFIG"); fi
        if [ -n "$INPUT_PRESET" ]; then ARGS+=(--preset "$INPUT_PRESET"); fi
        if [ -n "$INPUT_MODELS" ]; then ARGS+=(--models "$INPUT_MODELS"); fi
        if [ -n "$INPUT_COST_TARGET" ]; then ARGS+=(--cost-target "$INPUT_COST_TARGET"); fi
        node "${{ github.action_path }}/dist/cli.js" "${ARGS[@]}"

        node -e '
          const r = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/juror.json", "utf8"));
          const out = require("fs");
          out.appendFileSync(process.env.GITHUB_OUTPUT, `score=${r.verdict.score}\n`);
          out.appendFileSync(process.env.GITHUB_OUTPUT, `findings=${r.published.length}\n`);
          const cost = r.totals.usd == null || r.totals.partial ? "unknown" : r.totals.usd;
          out.appendFileSync(process.env.GITHUB_OUTPUT, `cost-usd=${cost}\n`);
        '
