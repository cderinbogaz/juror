# Dogfood: Juror reviews Juror. Every PR here carries a public cost receipt.
name: Juror

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: juror-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: runnerhut-linux-2vcpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every ref and the complete commit graph, so base-revision policy and merge-base
          # resolution still work. `blob:none` only skips historical file contents, which are
          # the bulk of the clone on a busy repository and are fetched on demand if a review
          # ever needs one.
          fetch-depth: 0
          filter: blob:none

      # Never execute action code from the pull request while provider secrets are present.
      # Dependabot can deliberately update this immutable revision after the reviewed code lands.
      - uses: juror-ai/juror@178a16d6fa3a1b868094bc4236d42fb8e442ea6a # v1.3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          JUROR_ANTHROPIC_API_KEY: ${{ secrets.JUROR_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          JUROR_OPENAI_API_KEY: ${{ secrets.JUROR_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          JUROR_XAI_API_KEY: ${{ secrets.JUROR_XAI_API_KEY || secrets.XAI_API_KEY }}
          JUROR_FIREWORKS_API_KEY: ${{ secrets.JUROR_FIREWORKS_API_KEY || secrets.FIREWORKS_API_KEY }}
          JUROR_OPENROUTER_API_KEY: ${{ secrets.JUROR_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
          JUROR_SCALEWAY_API_KEY: ${{ secrets.JUROR_SCALEWAY_API_KEY }}
