name: QA image CI

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - 'qa/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/qa-image-ci.yml'
      - '.github/workflows/release-qa-image.yml'
  pull_request:
    paths:
      - '.dockerignore'
      - 'qa/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/qa-image-ci.yml'
      - '.github/workflows/release-qa-image.yml'

permissions:
  contents: read

jobs:
  smoke:
    # Runnerhut is intentionally host-only. This job validates Docker image
    # isolation and therefore remains on GitHub's Linux Docker runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build QA image on native amd64
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker build \
            --platform linux/amd64 \
            --file qa/Dockerfile \
            --tag juror-qa:ci \
            .
          test "$(docker image inspect --format '{{.Architecture}}' juror-qa:ci)" = amd64

      - name: Verify container-isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          PW_UID="$(docker run --rm --entrypoint id juror-qa:ci -u pwuser)"
          PW_GID="$(docker run --rm --entrypoint id juror-qa:ci -g pwuser)"
          [[ "$PW_UID" =~ ^[0-9]+$ ]]
          [[ "$PW_GID" =~ ^[0-9]+$ ]]

          run_chromium_smoke() {
            local runtime_uid="$1"
            local runtime_gid="$2"
            docker run --rm --init \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=256m \
              --tmpfs "/home/pwuser:rw,nosuid,nodev,size=64m,uid=$runtime_uid,gid=$runtime_gid,mode=0700" \
              --shm-size=1g \
              --user "$runtime_uid:$runtime_gid" \
              --cap-drop=ALL \
              --security-opt no-new-privileges \
              --security-opt "seccomp=$GITHUB_WORKSPACE/qa/seccomp_profile.json" \
              --pids-limit=256 \
              --memory=2g \
              --cpus=2 \
              --entrypoint node \
              juror-qa:ci \
              /opt/juror/qa/smoke-chromium.mjs
          }

          run_chromium_smoke "$PW_UID" "$PW_GID"

          # Composite-action runners can use any numeric host identity. Exercise
          # that path with IDs which deliberately have no image passwd entry.
          ARBITRARY_UID="$((PW_UID + 10000))"
          ARBITRARY_GID="$((PW_GID + 10000))"
          [ "$ARBITRARY_UID" -ne "$PW_UID" ]
          [ "$ARBITRARY_GID" -ne "$PW_GID" ]
          run_chromium_smoke "$ARBITRARY_UID" "$ARBITRARY_GID"
