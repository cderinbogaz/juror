name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: runnerhut-linux-4vcpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright tests
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:compatibility
      - run: npm test
      - run: npm run check:secure-refs

  cloud:
    runs-on: runnerhut-rh-9e2c30238586
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: cloud
      - run: npm run types:check
        working-directory: cloud
      - run: npm run typecheck
        working-directory: cloud
      - run: npm run typecheck:worker
        working-directory: cloud
      - run: npm test
        working-directory: cloud
      - run: npm run build
        working-directory: cloud

  marketing:
    runs-on: runnerhut-linux-1vcpu
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx wrangler types
      - run: npm run deploy:dry-run

  # This repo is public and is handed provider keys at runtime. One committed key is
  # the worst thing that can happen to it, so the check is a build gate rather than a habit.
  secrets-scan:
    runs-on: runnerhut-linux-1vcpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assert no provider keys are committed
        run: |
          set -euo pipefail
          # Lengths are set to what a real key actually looks like. A looser pattern matches
          # the redaction regexes in src/util/log.ts and this very file, and a scanner that
          # cries wolf on its own definitions gets muted within a week.
          PATTERN='sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{40,}'
          PATTERN="$PATTERN|sk-proj-[A-Za-z0-9_-]{40,}"
          PATTERN="$PATTERN|sk-or-v1-[A-Za-z0-9_-]{40,}"
          PATTERN="$PATTERN|xai-[A-Za-z0-9]{40,}"
          PATTERN="$PATTERN|fw_[A-Za-z0-9]{20,}"
          PATTERN="$PATTERN|gh[pousr]_[A-Za-z0-9]{36}"
          PATTERN="$PATTERN|github_pat_[A-Za-z0-9_]{60,}"
          if git grep -nEI "$PATTERN" -- .; then
            echo "::error::A provider key shape was found in the tree."
            exit 1
          fi
          echo "clean"

      - name: Assert .env can never be committed
        run: |
          set -euo pipefail
          git check-ignore -q .env || { echo "::error::.env is not gitignored"; exit 1; }
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
          echo "clean"
